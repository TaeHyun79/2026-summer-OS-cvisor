# Lima VM for cvisor development on an Apple Silicon Mac.
# x86-64 Debian under QEMU TCG full-system emulation — slow but ptrace works
# completely (spec §2.1, option 2). glibc means malloc uses brk, so the
# [heap] panel actually shows something (musl's mmap-based malloc would not).
#
#   limactl create --name=cvisor vm/lima-cvisor.yaml
#   limactl start cvisor
#   limactl shell cvisor
#   cd ~/CLionProjects/OSpre && make && make tests && ./cvisor tests/factorial
vmType: "qemu"
arch: "x86_64"
images:
  - location: "https://cloud.debian.org/images/cloud/bookworm/latest/debian-12-genericcloud-amd64.qcow2"
    arch: "x86_64"
cpus: 4
memory: "4GiB"
disk: "10GiB"
# Debian's cloud kernel has no 9p modules, so virtfs mounts silently fail —
# reverse-sshfs works with any guest kernel (needs sshfs installed in guest).
mountType: "reverse-sshfs"
mounts:
  - location: "~/CLionProjects/OSpre"
    writable: true
provision:
  - mode: system
    script: |
      #!/bin/bash
      set -eux
      export DEBIAN_FRONTEND=noninteractive
      apt-get update
      apt-get install -y --no-install-recommends \
          gcc make binutils libncurses-dev gdb sshfs
